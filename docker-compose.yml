services:
  oracle_fusion_integration_db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: oracle_fusion_integration_db
    restart: on-failure #unless-stopped
    ports:
      - '1436:1433'
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - oracle_fusion_integration_db_data:/var/opt/mssql

volumes:
  oracle_fusion_integration_db_data:
